<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b16" />
    <meta name="description" content="OmniFlow — zero-cost, private, offline-first personal finance PWA. No backend. Your data stays encrypted in your browser." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OmniFlow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <title>OmniFlow — private finance</title>
    <style>
      /* Minimal critical CSS so first paint is not jarring before React mounts.
         Dark background only — no in-flow placeholder box (a #root::before would
         stay in normal flow after mount and push the whole app down by a viewport). */
      html,body{margin:0;background:#070b16;color:#eef2fb;font-family:'Source Sans 3',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
      #root{min-height:100vh}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
